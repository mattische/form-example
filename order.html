<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>webshop</title>
    <link rel="stylesheet" href="style/style.css" />
    <script src="https://js.stripe.com/clover/stripe.js"></script>
    <script src="views/cart.js" type="module" defer></script>
    <script src="views/order.js" type="module" defer></script>
</head>
<body class="site">
    <div class="cart-content" id="cart-content">
        <div class="cart-header">
            <h3>Inköpsvagn</h3>
            <p class="close-cart" id="close-cart">x</p>
        </div>
        <div class="cart-products" id="cart-products"></div>
        <a class="button" id="order-button" href="order.html" hidden>Beställ</a>
    </div>
    <header class="header">
        <h1><a href="index.html">Emil's skivor</a></h1>
        <div class="cart" id="cart">🛒 <span id="cart-count">0</span></div>
    </header>
    <main class="container">
        <div class="order-form-container">
            <h2>Kundinformation</h2>
            <div class="checkout" id="checkout"></div>
            <form id="order-form" class="order-form">
                <label for="firstname">Förnamn</label>
                <input class="input" type="text" name="firstname" id="firstname" autocomplete="given-name" required>

                <label for="address">Adress</label>
                <input class="input" type="text" name="address" id="address" autocomplete="street-address" required>

                <label for="zip">Postnummer (fem siffror, till exempel 379 79)</label>
                <input class="input" type="text" name="zip" id="zip" inputmode="numeric" pattern="[0-9]{3} ?[0-9]{2}" autocomplete="postal-code" required>

                <label for="city">Ort</label>
                <input class="input" type="text" name="city" id="city" autocomplete="address-level2" required>

                <label for="phone">Telefon (till exempel 0731234567)</label>
                <input class="input" type="tel" name="phone" id="phone" pattern="07[0236][0-9]{7}" autocomplete="tel">

                <label for="email">E-post (hämtas från din betalning)</label>
                <input class="input" type="email" readonly name="email" id="email">

                <input type="submit" class="button" value="Skicka beställning">
            </form>
        </div>
    </main>
</body>
</html>
